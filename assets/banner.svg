  </g>

  <text x="300" y="152" fill="#e8eefc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800">doc<tspan fill="#58e08a">tors</tspan></text>
  <text x="304" y="208" fill="#c4d2ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28">代码健康体检全家桶 — 21 轴零依赖单文件 CLI</text>

